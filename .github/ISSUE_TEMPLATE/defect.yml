name: Defect
description: Report reproducible behavior that violates an existing contract
title: "[Defect] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Report one reproducible defect in the repository that owns the behavior. Do not disclose vulnerabilities, credentials, or private data here.
  - type: input
    id: repository_revision
    attributes:
      label: Repository and revision
      description: Identify the repository and exact commit, tag, or release.
      placeholder: dornglut/repository @ commit
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: State what happened, including exact errors or diagnostics.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State the behavior required by current documentation, tests, or public contracts.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest deterministic reproduction.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant platform, toolchain, configuration, and feature information.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and impact
      description: Add logs, traces, screenshots, tests, or links and explain the practical impact. Remove secrets and private data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This report is filed in the repository that owns the behavior.
          required: true
        - label: This report does not disclose a security vulnerability, credential, or private data.
          required: true
