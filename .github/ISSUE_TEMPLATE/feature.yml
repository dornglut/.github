name: Capability request
description: Propose a bounded product or framework capability
title: "[Capability] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete user, product, or engineering problem.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Required outcome
      description: State observable acceptance criteria rather than an implementation preference.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: Identify what belongs in this request and what must remain excluded.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and constraints
      description: Include examples, compatibility constraints, measurements, or related decisions.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues, plans, and decision records.
          required: true
        - label: The request is assigned to the repository that owns the behavior.
          required: true
