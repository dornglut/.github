name: Defect
description: Report reproducible incorrect behavior
title: "[Defect] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Report one reproducible defect. Security vulnerabilities must use private reporting.
  - type: input
    id: repository_revision
    attributes:
      label: Repository and revision
      description: Identify the repository and exact commit, tag, or release.
      placeholder: dornglut/repository @ commit
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: State what happened, including exact errors or diagnostics.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State the behavior required by current documentation or contracts.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest deterministic reproduction and relevant environment details.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs, traces, screenshots, tests, or links without exposing secrets.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This report does not disclose a security vulnerability.
          required: true
